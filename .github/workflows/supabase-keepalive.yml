name: Supabase keep-alive

# Supabase's free tier pauses a project after 7 days with no real database activity (see
# Story 6.1, web/supabase/migrations/0001_saved_songs.sql). A daily query is well within
# the "a few real requests per day" threshold Supabase itself says is enough to prevent
# that -- chosen instead of paying for the Pro tier, per the founder's explicit preference.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions), separate
# from both web/.env.local and Vercel's own Production env vars -- three different places
# the same two Supabase values need to live, not one:
#   SUPABASE_URL              (same value as NEXT_PUBLIC_SUPABASE_URL)
#   SUPABASE_PUBLISHABLE_KEY  (same value as NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY -- the
#                              "Publishable key" in Supabase's dashboard, Settings > API
#                              Keys, not the "Secret key")

on:
  schedule:
    - cron: "0 12 * * *" # once daily, 12:00 UTC
  workflow_dispatch: # lets you trigger a run manually from the Actions tab, to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to register real database activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Strips ALL trailing slashes from the URL secret (not just one -- `${VAR%/}` only
          # removes a single trailing slash, which would still leave a double slash after
          # e.g. a "https://x.co//" paste; sed handles any number, matching config.ts's
          # getSupabaseUrl() regex exactly, since this workflow constructs the same kind of
          # URL independently in bash rather than through that shared helper). A copy-pasted
          # URL with a trailing slash produces a double slash once /rest/v1/... is appended,
          # which PostgREST rejects outright (error PGRST125, "Invalid path specified")
          # rather than tolerating it -- hit exactly this live during Story 6.1 setup.
          CLEAN_URL="$(echo "${SUPABASE_URL}" | sed -E 's#/+$##')"
          curl -sf "${CLEAN_URL}/rest/v1/saved_songs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_PUBLISHABLE_KEY}" \
            -o /dev/null
